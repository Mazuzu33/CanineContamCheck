executor: slurm
jobs: 100
default-resources:
# Use a default runtime of 1 hour
  runtime: 60
# Use a default memory of 16GB
  mem_mb: 16000
  # Default account and partition
  slurm_account: fried255
  slurm_partition: msismall
# Use conda as the default software deployment method
set-resources:
  verifybamid:
    # On average verifybamid takes around 8 hrs to run. A max runtime of 36 hours is set.
    runtime: 2160
    # On average, verifybamid uses around 15 GB of memory. A max memory of 60 GB is set.
    mem_mb: 60000
  coordinatesortbam:
    # On average, coordinatesortbam takes around 1 hour to run. A max runtime of 4 hours is set.
    runtime: 240
    # On average, coordinatesortbam around 200 GB of memory. A max memory of 500 GB is set.
    mem_mb: 500000
    # Specify 8 threads to increase speed
    threads: 8
  qualimap:
    # On average, qualimap takes around 2 hours to run. A max runtime of 8 hours is set.
    runtime: 480
    # On average, qualimap takes around 100 GB of memory. A max memory of 300 GB is set.
    mem_mb: 300000
    # Specify 8 threads to increase speed
    threads: 8
sdm: conda